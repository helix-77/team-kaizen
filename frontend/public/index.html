<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RentPi — IoT Device Marketplace</title>
<meta name="description" content="Rent IoT devices instantly with RentPi marketplace">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">🔌 RentPi</div>
  <div class="nav-links">
    <button class="nav-btn active" data-view="dashboard">Dashboard</button>
    <button class="nav-btn" data-view="devices">Devices</button>
    <button class="nav-btn" data-view="analytics">Analytics</button>
    <button class="nav-btn" data-view="chat">AI Chat</button>
  </div>
  <div class="nav-status" id="statusDot">● Connecting…</div>
</nav>

<main id="app">
  <!-- Dashboard -->
  <section id="view-dashboard" class="view active">
    <h1>Welcome to <span class="gradient-text">RentPi</span></h1>
    <p class="subtitle">IoT Device Rental Marketplace</p>
    <div class="card-grid" id="summaryCards"></div>
    <div class="card" id="serviceHealth"><h3>Service Health</h3><div id="healthGrid" class="health-grid"></div></div>
  </section>

  <!-- Devices -->
  <section id="view-devices" class="view">
    <h2>Device Catalog</h2>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search devices…">
      <select id="filterType"><option value="">All Types</option></select>
      <button class="btn" onclick="searchDevices()">Search</button>
    </div>
    <div id="deviceList" class="card-grid"></div>
    <div class="pagination" id="pagination"></div>
  </section>

  <!-- Analytics -->
  <section id="view-analytics" class="view">
    <h2>Analytics</h2>
    <div class="tab-bar">
      <button class="tab active" onclick="loadAnalytics('summary')">Summary</button>
      <button class="tab" onclick="loadAnalytics('trends')">Trends</button>
      <button class="tab" onclick="loadAnalytics('peak')">Peak Window</button>
      <button class="tab" onclick="loadAnalytics('spikes')">Price Spikes</button>
    </div>
    <div class="card" id="analyticsContent"><p>Loading…</p></div>
  </section>

  <!-- Chat -->
  <section id="view-chat" class="view">
    <h2>RentPi AI Assistant</h2>
    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="msg assistant">Hi! I'm RentPi Assistant. Ask me about IoT devices, pricing, or availability.</div>
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Ask about devices…" onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn" onclick="sendChat()">Send</button>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
